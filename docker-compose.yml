services:
  postgres:
    image: postgres:16-alpine
    container_name: tontine-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tontine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tontine_saas}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - tontine_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tontine-saas-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Définissez REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - tontine_redisdata:/data

volumes:
  tontine_pgdata:
  tontine_redisdata:
